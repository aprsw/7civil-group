# ───────────────────────────────────────────────────────────────────────────
# سامانه اتوماسیون اداری گروه متحد 7 — Apache vhost (Windows / XAMPP)
#
# Serves the built frontend and the PHP API from ONE origin and ONE port, so
# every machine on the network opens a single address and the browser makes
# no cross-origin request at all.
#
# Install:
#   1) Edit the two paths below to match where the project sits.
#   2) Add to the END of C:\xampp\apache\conf\httpd.conf:
#          Include "C:/7civil-group/deploy/apache/7civil.conf"
#   3) Restart Apache.
#
# Requires mod_rewrite and mod_headers (both ship enabled with XAMPP).
# ───────────────────────────────────────────────────────────────────────────

# Listen on every interface so the server is reachable from the LAN, not just
# from the server console. Port 80 means colleagues type a bare IP with no
# port: http://192.168.1.50/
Listen 80

<VirtualHost *:80>
    ServerName civil7.local

    # ── 1) The built SPA (run `npm run build` in frontend/ first) ──────────
    DocumentRoot "C:/7civil-group/frontend/dist"
    <Directory "C:/7civil-group/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All          # lets dist/.htaccess do the SPA fallback
        Require all granted
    </Directory>

    # ── 2) The JSON API — same origin, so no CORS is involved ─────────────
    # AliasMatch sends every /api/... straight to the front controller and
    # leaves REQUEST_URI untouched, which is what the router matches on.
    # (A plain Alias plus a per-directory RewriteRule also works, but the
    # rewrite strips the prefix and the routes stop matching.)
    AliasMatch "^/api(/.*)?$" "C:/7civil-group/backend/public/index.php"
    <Directory "C:/7civil-group/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── 3) Uploaded photos, signatures and logos ──────────────────────────
    Alias /uploads "C:/7civil-group/backend/public/uploads"
    <Directory "C:/7civil-group/backend/public/uploads">
        Options -Indexes
        AllowOverride All          # the .htaccess there disables execution
        Require all granted
    </Directory>

    # The installer rewrites .env and rebuilds tables. It is refused once
    # storage/installed.lock exists, but on a networked server it has no
    # business being reachable at all. Delete the file, and keep this as a
    # second lock.
    <Files "install.php">
        Require all denied
    </Files>

    # Attachments can be a few MB; raise if yours are larger.
    LimitRequestBody 20971520

    ErrorLog  "C:/7civil-group/deploy/apache/error.log"
    CustomLog "C:/7civil-group/deploy/apache/access.log" common
</VirtualHost>
